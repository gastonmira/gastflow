name: Prompt Evals (informational)

# Runs the prompt eval suite on any PR that touches skill or eval files.
# Results are INFORMATIONAL — the job does not block merging. Rubric scores
# are noisy under Haiku-as-grader on subjective criteria, so the suite is
# meant to flag regressions for human review rather than serve as a binary
# gate. Revisit this once evals are multi-sampled and recalibrated.

on:
  pull_request:
    paths:
      - "skills/gastflow.md"
      - "skills/gastflow-se.md"
      - "skills/gastflow-qa.md"
      - "skills/gastflow-bugfix.md"
      - "skills/gastflow-automation.md"
      - "codex/gastflow/**"
      - "install.sh"
      - "README.md"
      - "evals/**"

jobs:
  evals:
    name: Run agent prompt evals (informational)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Codex distribution
        run: python evals/validate_codex_distribution.py

      - name: Run evals
        # Non-blocking: see header comment. Review the step log manually.
        continue-on-error: true
        run: python evals/run_evals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/
          retention-days: 7
