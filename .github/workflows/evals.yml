name: Prompt Evals

on:
  pull_request:
    paths:
      - "skills/gastflow.md"   # Only runs when the skill prompts change

jobs:
  evals:
    name: Run agent prompt evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evals
        run: python evals/run_evals.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/
          retention-days: 7
